<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞虎的奇妙冒险 · 横版弹幕射击</title>
<link rel="stylesheet" href="css/style.css?v=20260908r31">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- 局内 HUD -->
  <div id="hud" class="hidden">
    <!-- 左上角：轮次 / 成长 / 击破 / 命 -->
    <div class="hud-topleft">
      <div class="hud-info">
        <span id="round-text">第 1 轮</span>
        <span id="level-text">成长 0 次</span>
        <span id="score-text">击破 0</span>
        <span id="lives-text" class="lives-text">❤❤❤</span>
      </div>
    </div>
    <!-- 右上角：近战技能 + 音效/音乐开关 -->
    <div class="hud-right">
      <div id="melee-box" title="近战爪击">
        <div id="melee-icon">爪</div>
        <div id="melee-cd"></div>
      </div>
      <div class="hud-btns">
        <button id="bgm-btn" type="button">音乐 开</button>
        <button id="mute-btn" type="button">音效 开</button>
      </div>
    </div>
    <!-- 左下角：生命 / 能量 -->
    <div class="hud-bottomleft">
      <div class="bar-row">
        <span class="bar-label">生命</span>
        <div class="bar-outer">
          <div id="hp-bar" class="bar-inner hp"></div>
          <span id="hp-text" class="bar-text">100/100</span>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">能量</span>
        <div class="bar-outer energy-outer">
          <div id="xp-bar" class="bar-inner xp"></div>
          <span id="xp-text" class="bar-text">0/10</span>
        </div>
      </div>
    </div>
    <!-- 屏幕中线正下方：怒气 -->
    <div class="hud-rage">
      <span class="rage-label">怒气</span>
      <div class="bar-outer rage-outer" id="rage-box">
        <div id="rage-bar" class="bar-inner rage"></div>
        <span id="rage-text" class="bar-text rage-text">0/100</span>
      </div>
    </div>
  </div>

  <!-- Boss 血条 -->
  <div id="boss-hud" class="hidden">
    <div id="boss-name">火焰飞猪王</div>
    <div class="boss-bar-outer"><div id="boss-bar" class="boss-bar-inner"></div></div>
  </div>

  <!-- Boss 预警 -->
  <div id="boss-warn" class="hidden">
    <div class="warn-flash"></div>
    <div class="warn-text">⚠ 警 告 ⚠<br><span id="warn-sub">强大的气息逼近了！</span></div>
  </div>

  <!-- 升级三选一 -->
  <div id="levelup" class="hidden">
    <div class="lu-title">⚡ 飞虎成长 ⚡</div>
    <div class="lu-sub">选择一项强化（按 1 / 2 / 3 或点击）</div>
    <div id="lu-cards"></div>
  </div>

  <!-- 开始菜单 -->
  <div id="menu">
    <!-- 右上角：背景音乐开关 -->
    <div class="menu-topright">
      <button id="menu-bgm-btn" class="audio-btn" type="button">🎵 背景音乐：开</button>
    </div>

    <div class="title-cn">飞虎的奇妙冒险</div>
    <div class="title-en">FLYING TIGER'S BIZARRE ADVENTURE</div>

    <!-- 备战角色（醒目）：头像 + 名称 + 能力/大招/自动技能 -->
    <div class="standby-hero">
      <div class="standby-avatar" id="standby-avatar"></div>
      <div class="standby-info">
        <div class="standby-row">
          <span class="standby-label">🐱 备战角色</span>
          <span id="standby-name">小白</span>
        </div>
        <div class="standby-detail" id="standby-detail"></div>
      </div>
    </div>

    <div class="menu-main">
      <button id="select-btn" class="big-btn" type="button">🐱 选择角色</button>
      <button id="start-btn" class="big-btn" type="button">▶ 开始游戏</button>
      <button id="menu-map-btn" class="big-btn map-btn" type="button" title="点击切换地图">🎲 随机地图</button>
      <div class="mode-row">
        <button id="mode-keyboard" class="mode-btn active" type="button">⌨ 键盘模式<small>方向键 / WASD</small></button>
        <button id="mode-mouse" class="mode-btn" type="button">🖱 鼠标模式<small>移动鼠标引导飞行</small></button>
      </div>
    </div>

    <!-- 操作说明：左侧靠下（去掉近战/强化/轮次） -->
    <div class="menu-ctrl">
      <div><b>移动</b>　键盘模式：方向键 / WASD　｜　鼠标模式：鼠标位置引导（均自动射击）</div>
      <div><b>大招</b>　击杀积满怒气，按 <kbd>空格</kbd>/<kbd>J</kbd> 释放大招，肃清全屏小怪</div>
      <div><b>其他</b>　<kbd>P</kbd> 暂停　<kbd>M</kbd> 音效　<kbd>N</kbd> 音乐</div>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="pause" class="hidden">
    <div class="pause-text">暂 停</div>
    <div class="pause-btns">
      <button id="pause-resume-btn" class="pause-btn" type="button">▶ 继续游戏</button>
      <button id="pause-restart-btn" class="pause-btn" type="button">↻ 重新开始</button>
      <button id="pause-select-btn" class="pause-btn" type="button">🐱 角色选择</button>
    </div>
  </div>

  <!-- 角色选择 -->
  <div id="charsel" class="hidden">
    <div id="charsel-title">选择出战角色</div>
    <div id="char-grid"></div>
    <button id="char-back-btn" class="pause-btn alt" type="button">← 返回菜单</button>
  </div>

  <!-- 游戏结束 -->
  <div id="gameover" class="hidden">
    <div class="go-title">飞虎陨落</div>
    <div id="go-stats" class="go-stats"></div>
    <button id="restart-btn" class="big-btn" type="button">↻ 再战一场</button>
  </div>
</div>

<script src="js/sprites.js?v=20260908r38"></script>
<script src="js/characters.js?v=20260907r66"></script>
<script src="js/config.js?v=20260906r60"></script>
<script src="js/audio.js?v=20260908r31"></script>
<script src="js/music.js?v=20260906r53"></script>
<script src="js/entities.js?v=20260908r83"></script>
<script src="js/bosses.js?v=20260908r93"></script>
<script src="js/game.js?v=20260908r99"></script>
</body>
</html>
